[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-shim"
version = "0.2.0"
description = "MCP stdio server for surgical, table-safe editing of an Obsidian vault via the Local REST API plugin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andy Olson" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.scripts]
obsidian-shim = "obsidian_shim:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live Obsidian Local REST API",
]
